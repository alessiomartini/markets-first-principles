name: Deploy notes worker

# Manual only. This provisions real cloud infrastructure — a D1 database and a
# public Worker — so it must never fire on a push. Run it from the Actions tab
# when the worker or its schema changes.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      # Look the database up by name and create it only if missing, so the
      # workflow is safe to re-run. `wrangler d1 create` on an existing name
      # fails, and creating a second database would silently split the notes
      # across two of them.
      - name: Find or create the D1 database
        id: database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          name=markets-first-principles-notes

          # wrangler's output is captured before jq touches it, and never piped
          # into `head`. Piping it into a command that exits early closes the
          # pipe under wrangler, which then dies with EPIPE — and the resulting
          # stack trace buries whatever the Cloudflare API actually said. That
          # happened on the first run and cost a debugging round: the real error
          # was an authentication failure, three lines above the noise.
          lookup() {
            local out
            if ! out=$(npx wrangler d1 list --json 2>&1); then
              echo "wrangler d1 list failed:" >&2
              echo "$out" >&2
              return 1
            fi
            printf '%s' "$out" | jq -r --arg n "$name" '[.[] | select(.name == $n) | .uuid][0] // ""'
          }

          id=$(lookup)

          if [ -z "$id" ]; then
            echo "creating $name"
            npx wrangler d1 create "$name"
            id=$(lookup)
          else
            echo "reusing existing $name"
          fi

          if [ -z "$id" ] || [ "$id" = "null" ]; then
            echo "could not determine the database id" >&2
            exit 1
          fi


          echo "database_id=$id" >> "$GITHUB_OUTPUT"
          echo "id is $id"

      # CREATE TABLE IF NOT EXISTS, so re-running is a no-op.
      - name: Apply the schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler d1 execute markets-first-principles-notes --remote --file=schema.sql --yes

      # Rewrites whatever value is in the config, so this works both for the
      # committed id and for the REPLACE_WITH_DATABASE_ID placeholder a fresh
      # clone would carry.
      - name: Point wrangler.jsonc at the database
        env:
          DATABASE_ID: ${{ steps.database.outputs.database_id }}
        run: |
          set -euo pipefail
          sed -i -E "s/(\"database_id\": )\"[^\"]*\"/\1\"$DATABASE_ID\"/" wrangler.jsonc
          grep database_id wrangler.jsonc

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy

      - name: Summary
        run: |
          {
            echo "### Notes worker deployed"
            echo
            echo "- database_id: \`${{ steps.database.outputs.database_id }}\`"
            echo "- Put the URL printed by \`wrangler deploy\` above into"
            echo "  \`WORKER_URL\` in \`public/js/notes-widget.js\` if it differs."
          } >> "$GITHUB_STEP_SUMMARY"
