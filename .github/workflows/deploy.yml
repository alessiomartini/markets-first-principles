name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  # A push made by a workflow using GITHUB_TOKEN does not trigger other
  # workflows — GitHub's loop protection. Without this, the nightly data
  # refresh would commit new figures and never publish them. Chaining off the
  # refresh workflow's completion is the supported way round it.
  workflow_run:
    workflows: ['Refresh figure data']
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; always finish the one in flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # When chained off the refresh workflow, only publish if that run actually
    # succeeded — a failed fetch should leave the live site on its last good
    # data rather than redeploying on the back of an error.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run events check out the commit that triggered the *parent*
          # workflow, which predates the data commit the refresh just pushed.
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The content map is the single source of truth for which pages exist.
      # A page in the map with no file (or the reverse) fails the build here
      # rather than silently 404ing later.
      - name: Check content map
        run: npm run scaffold -- --check

      # Card ids are the join between content in git and review history in D1.
      # Renaming one orphans everything ever recorded about that card, silently
      # and irreversibly, so the validator gates the build. Its strongest check
      # — comparing against the ids that actually appear in the log — needs
      # credentials CI does not have and is skipped with a warning here; run
      # `npm run flashcards:pull-ids` locally before renaming or deleting a card.
      - name: Validate flashcards
        run: npm run validate:cards

      - name: Unit tests
        run: npm test

      # Build before touching Pages, so a deployment-side misconfiguration
      # cannot mask a genuine build failure. Nothing in the build depends on
      # configure-pages: the base path is set in astro.config.mjs.
      - run: npm run build

      # Requires Pages to be switched on once, by hand, at
      # Settings → Pages → Source: GitHub Actions. `enablement: true` looks
      # like it would automate that away, but creating a Pages site is not
      # something the workflow's GITHUB_TOKEN is allowed to do — it fails with
      # "Resource not accessible by integration".
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
