name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; always finish the one in flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The content map is the single source of truth for which pages exist.
      # A page in the map with no file (or the reverse) fails the build here
      # rather than silently 404ing later.
      - name: Check content map
        run: npm run scaffold -- --check

      # enablement turns Pages on for the repository the first time this runs,
      # so a fresh clone of this project deploys without anyone visiting the
      # settings page. Without it the action fails with "Get Pages site failed".
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
